services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  uploadbot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_API_MODE: local
      BOT_API_BASE_URL: http://telegram-bot-api:8081/bot
      BOT_API_FILE_URL: http://telegram-bot-api:8081/file/bot
      FILES_DIR: /app/files
    depends_on:
      - telegram-bot-api
    volumes:
      - ./files:/app/files
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro

volumes:
  telegram-bot-api-data:
